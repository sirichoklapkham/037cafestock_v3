    <script>
        const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxxXeOIaZ5Z8mtqpEwstYkk_HVXhr5C5h_KQXRCD4Wv6-UonmJftfzTnK0O3bs8TN_FWg/exec';
        let googleScriptUrl = DEFAULT_SCRIPT_URL;

        let activeTabId = 'calendar';
        let selectedAdjustType = 'ADD';

        let categories = [{ id: 1, name: 'ทั่วไป' }];
        let items = [];
        let purchases = [];
        let adjustLogs = [];
        let autoSyncTimer = null;

        let calendarCurrentDate = new Date();
        let selectedDateStr = getFormattedDate(); 

        function normalizeText(str) {
            if (!str) return '';
            return String(str).toLowerCase().replace(/[\u0300-\u036f]/g, '').replace(/[่้๊๋็์ํ๎]/g, '').replace(/\s+/g, '');
        }

        // ==========================================
        //  RECONSTRUCTED DATE ENGINE
        // ==========================================

        function getDateKey(dateInput) {
            if (!dateInput) return '';
            
            let d, m, y;

            if (dateInput instanceof Date) {
                if (isNaN(dateInput.getTime())) return '';
                d = dateInput.getDate();
                m = dateInput.getMonth() + 1;
                y = dateInput.getFullYear();
            } else {
                let str = String(dateInput).trim();
                if (str.includes(' ')) str = str.split(' ')[0];
                if (str.includes('T')) str = str.split('T')[0];

                if (str.includes('-')) {
                    const parts = str.split('-');
                    if (parts.length === 3) {
                        if (parts[0].length === 4) {
                            y = parseInt(parts[0], 10);
                            m = parseInt(parts[1], 10);
                            d = parseInt(parts[2], 10);
                        } else {
                            d = parseInt(parts[0], 10);
                            m = parseInt(parts[1], 10);
                            y = parseInt(parts[2], 10);
                        }
                    }
                } else if (str.includes('/')) {
                    const parts = str.split('/');
                    if (parts.length === 3) {
                        if (parts[2].length === 4) {
                            d = parseInt(parts[0], 10);
                            m = parseInt(parts[1], 10);
                            y = parseInt(parts[2], 10);
                        } else if (parts[0].length === 4) {
                            y = parseInt(parts[0], 10);
                            m = parseInt(parts[1], 10);
                            d = parseInt(parts[2], 10);
                        } else {
                            d = parseInt(parts[0], 10);
                            m = parseInt(parts[1], 10);
                            y = parseInt(parts[2], 10);
                        }
                    }
                }
            }

            if (d && m && y) {
                if (y > 2500) y -= 543;
                return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            }

            return '';
        }

        function parseToStandardDateStr(dateInput) {
            const key = getDateKey(dateInput);
            if (!key) return String(dateInput || '');
            const parts = key.split('-');
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        function parseDateTimeToTimestamp(dateTimeStr) {
            if (!dateTimeStr) return 0;
            if (dateTimeStr instanceof Date) return dateTimeStr.getTime();
            
            let str = String(dateTimeStr).trim();
            let datePart = str;
            let timePart = "00:00:00";
            
            if (str.includes(" ")) {
                const parts = str.split(" ");
                datePart = parts[0];
                timePart = parts[1] || "00:00:00";
            } else if (str.includes("T")) {
                const parts = str.split("T");
                datePart = parts[0];
                timePart = parts[1] || "00:00:00";
            }
            
            const key = getDateKey(datePart);
            if (!key) return 0;
            const dParts = key.split("-");
            
            let year = parseInt(dParts[0], 10);
            let month = parseInt(dParts[1], 10) - 1;
            let day = parseInt(dParts[2], 10);
            
            const tParts = timePart.split(":");
            let hour = parseInt(tParts[0] || 0, 10);
            let min = parseInt(tParts[1] || 0, 10);
            let sec = parseInt(tParts[2] || 0, 10);
            
            return new Date(year, month, day, hour, min, sec).getTime();
        }

        function getFormattedDate(daysAgo = 0) {
            const d = new Date();
            d.setDate(d.getDate() - daysAgo);
            return parseToStandardDateStr(d);
        }

        function setSyncStatusUI(isSyncing, message = '') {
            const chipText = document.getElementById('calendar-status-chip');
            const chipIcon = document.getElementById('sync-status-icon');
            const syncCard = document.getElementById('sync-status-card');

            if (!chipText || !chipIcon || !syncCard) return;

            if (isSyncing) {
                chipText.innerText = message || 'กำลังซิงค์ข้อมูลเรียลไทม์...';
                chipIcon.className = 'fa-solid fa-arrows-rotate fa-spin text-amber-600 text-base';
                syncCard.className = 'bg-amber-50 border border-amber-200/80 rounded-2xl p-3 flex items-center justify-between text-amber-800 text-xs font-medium card-shadow transition-all duration-300';
            } else {
                chipText.innerText = message || 'ซิงค์ข้อมูลเรียลไทม์เรียบร้อย';
                chipIcon.className = 'fa-solid fa-circle-check text-sage-500 text-base';
                syncCard.className = 'bg-sage-50 border border-sage-500/30 rounded-2xl p-3 flex items-center justify-between text-sage-700 text-xs font-medium card-shadow transition-all duration-300';
            }
        }

        async function fetchDataFromGoogleSheet(showToastAlert = false) {
            if (!googleScriptUrl) return;

            try {
                setSyncStatusUI(true, showToastAlert ? 'กำลังซิงค์ข้อมูลเรียลไทม์...' : 'ซิงค์ข้อมูลเรียลไทม์...');
                if (showToastAlert) showToast('กำลังซิงค์ข้อมูลเรียลไทม์...');

                const fetchUrl = googleScriptUrl + (googleScriptUrl.includes('?') ? '&' : '?') + '_t=' + Date.now();
                const res = await fetch(fetchUrl, { cache: 'no-store' });
                const resData = await res.json();

                if (resData.categories && Array.isArray(resData.categories)) categories = resData.categories;

                if (resData.purchases && Array.isArray(resData.purchases)) {
                    purchases = resData.purchases.map(p => ({ 
                        ...p, 
                        date: parseToStandardDateStr(p.date),
                        dateKey: getDateKey(p.date),
                        timestamp: p.timestamp || p.date
                    }));
                } else {
                    purchases = [];
                }

                if (resData.adjustLogs && Array.isArray(resData.adjustLogs)) {
                    adjustLogs = resData.adjustLogs.map(l => ({ 
                        ...l, 
                        date: parseToStandardDateStr(l.date),
                        dateKey: getDateKey(l.date),
                        timestamp: l.timestamp || l.date
                    }));
                } else {
                    adjustLogs = [];
                }

                const rawItems = Array.isArray(resData) ? resData : (resData.items || []);
                if (rawItems.length > 0) {
                    items = rawItems.map((row, idx) => {
                        const catName = row.categoryName || row['หมวดหมู่'] || 'ทั่วไป';
                        let matchedCat = categories.find(c => c.name === catName);
                        if (!matchedCat) {
                            matchedCat = { id: categories.length + 1, name: catName };
                            categories.push(matchedCat);
                        }
                        const isOrderedVal = row.isOrdered !== undefined ? row.isOrdered : row['สั่งซื้อแล้ว'];
                        const isOrderedBool = (isOrderedVal === true || String(isOrderedVal).toUpperCase() === 'TRUE');

                        return {
                            id: row.id || idx + 1,
                            code: row.code || row['รหัสสินค้า'] || '',
                            name: row.name || row['ชื่อสินค้า'] || '',
                            stock: Number(row.stock !== undefined ? row.stock : row['จำนวนคงเหลือ']) || 0,
                            minAlert: Number(row.minAlert !== undefined ? row.minAlert : row['จุดเตือนสต๊อกต่ำ (Min Stock)']) || 0,
                            lastCost: Number(row.lastCost !== undefined ? row.lastCost : row['ราคาต้นทุนที่ซื้อ']) || 0,
                            categoryId: matchedCat.id,
                            categoryName: catName,
                            unit: row.unit || 'ชิ้น',
                            isOrdered: isOrderedBool,
                            orderedQty: Number(row.orderedQty || row['จำนวนที่สั่งซื้อ'] || 0),
                            orderedNote: String(row.orderedNote || row['หมายเหตุสั่งซื้อ'] || '')
                        };
                    });
                } else {
                    items = [];
                }
                
                setSyncStatusUI(false, 'ซิงค์ข้อมูลเรียลไทม์เรียบร้อย');
                if (showToastAlert) showToast('ซิงค์ข้อมูลเรียบร้อยแล้ว');
            } catch (err) {
                console.error('Fetch error:', err);
                setSyncStatusUI(false, 'การเชื่อมต่อขัดข้อง');
                if (showToastAlert) showToast('การเชื่อมต่อขัดข้อง');
            }

            renderAllViewsWithoutReset();
        }

        function startAutoSync() {
            if (autoSyncTimer) clearInterval(autoSyncTimer);
            autoSyncTimer = setInterval(() => {
                fetchDataFromGoogleSheet(false);
            }, 3000);
        }

        async function syncItemToGoogleSheet(action, payloadData) {
            if (!googleScriptUrl) return;
            try {
                setSyncStatusUI(true, 'กำลังบันทึกลง Sheet...');
                await fetch(googleScriptUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, ...payloadData })
                });

                setTimeout(async () => {
                    await fetchDataFromGoogleSheet(false);
                }, 1200);
            } catch (err) { 
                console.error(err); 
                setSyncStatusUI(false, 'บันทึกล้มเหลว');
            }
        }

        function switchTab(tabId) {

            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));

        /* ------------------ CALENDAR VIEW ------------------ */
        function changeCalendarMonth(offset) {
            calendarCurrentDate.setMonth(calendarCurrentDate.getMonth() + offset);
            renderCalendarView();
        }

        function resetCalendarToCurrent() {
            calendarCurrentDate = new Date();
            selectedDateStr = getFormattedDate();
            renderCalendarView();
            showDayDetails(selectedDateStr);
        }

        function renderCalendarView() {
            const grid = document.getElementById('calendar-grid');
            const title = document.getElementById('calendar-month-year');
            if (!grid) return;

            const year = calendarCurrentDate.getFullYear();
            const month = calendarCurrentDate.getMonth();

            const monthNamesTH = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            title.innerText = `${monthNamesTH[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const dailyTotals = {};
            const dailyHasAdd = {};
            const dailyHasSub = {};

            purchases.forEach(p => {
                const k = p.dateKey || getDateKey(p.date);
                if (k) {
                    dailyTotals[k] = (dailyTotals[k] || 0) + Number(p.total || 0);
                    dailyHasAdd[k] = true;
                }
            });

            adjustLogs.forEach(l => {
                const k = l.dateKey || getDateKey(l.date);
                if (k) {
                    if (l.type === 'SUB') dailyHasSub[k] = true;
                    else if (l.type === 'ADD') dailyHasAdd[k] = true;
                }
            });

            let html = '';
            for (let i = 0; i < firstDay; i++) {
                html += `<div class="p-1 min-h-[48px] bg-oak-50/20 rounded-xl"></div>`;
            }

            const todayKey = getDateKey(new Date());
            const selectedKey = getDateKey(selectedDateStr);

            for (let d = 1; d <= daysInMonth; d++) {
                const cellDate = new Date(year, month, d);
                const cellKey = getDateKey(cellDate);
                const cellDisplayDateStr = parseToStandardDateStr(cellDate);

                const isToday = (cellKey === todayKey);
                const isSelected = (cellKey === selectedKey);

                const hasAdd = Boolean(dailyHasAdd[cellKey]);
                const hasSub = Boolean(dailyHasSub[cellKey]);
                const hasExpense = (dailyTotals[cellKey] && dailyTotals[cellKey] > 0);

                let dotColorClass = '';
                if (hasAdd && hasSub) dotColorClass = 'bg-amber-500';
                else if (hasAdd) dotColorClass = 'bg-sage-500';
                else if (hasSub) dotColorClass = 'bg-rose-500';

                let bgClass = 'bg-oak-50/80 text-oak-800 hover:bg-oak-100';
                if (isSelected) bgClass = 'bg-amber-500 text-oak-900 font-bold shadow-md scale-105';
                else if (isToday) bgClass = 'bg-amber-100 text-amber-900 border border-amber-300 font-semibold';

                html += `
                    <div onclick="selectCalendarDate('${cellDisplayDateStr}')" class="p-1.5 min-h-[50px] rounded-2xl ${bgClass} transition-all duration-200 cursor-pointer flex flex-col justify-between items-center relative btn-hover-effect">
                        ${hasExpense ? `<span class="absolute top-0.5 left-1 text-[9px] leading-none" title="วันที่มีรายจ่ายสต๊อก">💰</span>` : ''}
                        <span class="text-xs ${hasExpense ? 'ml-auto' : ''}">${d}</span>
                        ${(hasAdd || hasSub) ? `
                            <span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-oak-900' : dotColorClass}"></span>
                        ` : '<span class="text-[9px] text-oak-300">-</span>'}
                    </div>
                `;
            }

            grid.innerHTML = html;
        }

        function selectCalendarDate(dateStr) {
            selectedDateStr = parseToStandardDateStr(dateStr);
            renderCalendarView();
            showDayDetails(selectedDateStr);
        }

        function showDayDetails(dateStr) {
            if (!dateStr) dateStr = selectedDateStr;
            const targetKey = getDateKey(dateStr);
            const targetDisplayDate = parseToStandardDateStr(dateStr);

            const dateTitle = document.getElementById('detail-date-title');
            const totalDisplay = document.getElementById('detail-total-amount');
            const countBadge = document.getElementById('detail-count-badge');
            const itemsList = document.getElementById('detail-items-list');

            if (!dateTitle || !itemsList) return;

            const dayPurchases = purchases.filter(p => (p.dateKey || getDateKey(p.date)) === targetKey);
            const dayLogs = adjustLogs.filter(l => (l.dateKey || getDateKey(l.date)) === targetKey);

            const totalSum = dayPurchases.reduce((sum, p) => sum + Number(p.total || 0), 0);

            dateTitle.innerText = targetDisplayDate;
            totalDisplay.innerText = `฿${totalSum.toLocaleString('th-TH', { minimumFractionDigits: 2 })}`;
            countBadge.innerText = `${dayPurchases.length + dayLogs.length} รายการ`;

            const combinedList = [];

            dayPurchases.forEach(p => {
                combinedList.push({
                    logType: 'PURCHASE',
                    timeMs: parseDateTimeToTimestamp(p.timestamp || p.date),
                    timestampStr: p.timestamp || p.date,
                    itemName: p.itemName || p.itemCode || 'สินค้า',
                    itemCode: p.itemCode || '',
                    qty: p.qty,
                    unitCost: p.unitCost,
                    total: p.total,
                    note: p.supplier || 'เติมสต๊อกด่วน'
                });
            });

            dayLogs.forEach(l => {
                combinedList.push({
                    logType: l.type,
                    timeMs: parseDateTimeToTimestamp(l.timestamp || l.date),
                    timestampStr: l.timestamp || l.date,
                    itemName: l.itemName || l.itemCode || 'สินค้า',
                    itemCode: l.itemCode || '',
                    qty: l.qty,
                    unitCost: 0,
                    total: 0,
                    note: l.reason || (l.type === 'SUB' ? 'เบิกหน้าร้าน' : 'ปรับสต๊อก')
                });
            });

            combinedList.sort((a, b) => b.timeMs - a.timeMs);

            if (combinedList.length === 0) {
                itemsList.innerHTML = `<p class="text-xs text-oak-300 py-3 text-center font-light">ไม่มีรายการลงของหรือเบิกออกในวันที่นี้</p>`;
            } else {
                let html = '';
                combinedList.forEach(item => {
                    let timeShow = '';
                    if (item.timestampStr && item.timestampStr.includes(' ')) {
                        timeShow = item.timestampStr.split(' ')[1];
                    } else if (item.timestampStr) {
                        timeShow = item.timestampStr;
                    }

                    const isAdd = (item.logType === 'PURCHASE' || item.logType === 'ADD');
                    
                    // ปรับแต่งสีพื้นหลังกล่องให้สว่างอ่อนลงนุ่มตาขึ้น
                    html += `
                        <div class="p-3 bg-[#4A3B32]/60 backdrop-blur-xs rounded-2xl border ${isAdd ? 'border-sage-500/50' : 'border-rose-400/40'} flex justify-between items-center text-xs transition-all hover:bg-[#58463B]/70">
                            <div>
                                <p class="font-semibold text-white flex items-center gap-1.5">
                                    <span class="w-2.5 h-2.5 rounded-full ${isAdd ? 'bg-sage-400 shadow-xs shadow-sage-400/50' : 'bg-rose-400 shadow-xs shadow-rose-400/50'}"></span>
                                    ${escapeHtml(item.itemName)} <span class="text-[10px] text-oak-300 font-mono">(${escapeHtml(item.itemCode)})</span>
                                </p>
                                <p class="text-[10px] text-oak-200/90 mt-0.5">
                                    ${isAdd ? 'เติมเข้า +' : 'เบิกออก -'}${item.qty} | ${item.unitCost > 0 ? 'ต้นทุน: ฿' + Number(item.unitCost).toFixed(2) + ' | ' : ''}${timeShow ? 'เวลา: ' + timeShow + ' | ' : ''}หมายเหตุ: ${escapeHtml(item.note)}
                                </p>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold ${isAdd ? 'text-sage-300' : 'text-rose-300'}">
                                    ${isAdd ? (item.total > 0 ? '฿' + Number(item.total).toLocaleString('th-TH', { minimumFractionDigits: 2 }) : 'เติมเข้า') : 'เบิกออก'}
                                </span>
                            </div>
                        </div>
                    `;
                });
                itemsList.innerHTML = html;
            }
        }

        /* ------------------ QUICK ADJUSTMENT & MODAL CLOSE HANDLERS ------------------ */
        function triggerQuickAddModal() { openQuickAdjustModalWithMode('ADD'); }
        function triggerQuickSubModal() { openQuickAdjustModalWithMode('SUB'); }

        function openQuickAdjustModalWithMode(mode, itemId = null) {
            const selectEl = document.getElementById('adjust-select-item');
            selectEl.innerHTML = items.map(i => `<option value="${i.id}">${escapeHtml(i.name)} (${escapeHtml(i.code)}) - เหลือ: ${i.stock} ${i.unit}</option>`).join('');
            
            if (itemId) selectEl.value = itemId;

            setAdjustType(mode);
            onAdjustItemChange();
            document.getElementById('adjust-qty').value = '';
            document.getElementById('adjust-reason').value = '';
            document.getElementById('quick-adjust-modal').classList.remove('hidden');
        }

        function closeAdjustModal() {
            const modal = document.getElementById('quick-adjust-modal');
            if (modal) modal.classList.add('hidden');
        }

        function onModalBackdropClick(event) {
            if (event.target.id === 'quick-adjust-modal') {
                closeAdjustModal();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeAdjustModal();
        });

        function onAdjustItemChange() {
            const itemId = Number(document.getElementById('adjust-select-item').value);
            const item = items.find(i => Number(i.id) === itemId);
            if (item) {
                document.getElementById('adjust-unit-label').innerText = item.unit;
                document.getElementById('adjust-unit-cost').value = item.lastCost || 0;
            }
            calculateAdjustTotal();
        }

        function calculateAdjustTotal() {
            const qty = Number(document.getElementById('adjust-qty').value) || 0;
            const cost = Number(document.getElementById('adjust-unit-cost').value) || 0;
            const total = qty * cost;
            document.getElementById('adjust-total-display').innerText = `฿${total.toLocaleString('th-TH', { minimumFractionDigits: 2 })}`;
        }

        function setAdjustType(type) {
            selectedAdjustType = type;
            const addBtn = document.getElementById('adjust-type-add');
            const subBtn = document.getElementById('adjust-type-sub');
            const costBox = document.getElementById('adjust-cost-container');
            const totalBox = document.getElementById('adjust-total-box');
            const titleEl = document.getElementById('adjust-modal-title');

            if (type === 'ADD') {
                titleEl.innerText = 'เติมสต๊อกสินค้าเข้า (เขียวแมกไม้)';
                addBtn.className = 'py-2 border border-sage-500/50 bg-sage-50 text-sage-700 rounded-xl font-semibold btn-hover-effect';
                subBtn.className = 'py-2 border border-oak-200 text-oak-600 rounded-xl font-semibold btn-hover-effect';
                costBox.classList.remove('hidden');
                totalBox.classList.remove('hidden');
            } else {
                titleEl.innerText = 'เบิกสินค้าออกจากสต๊อก (ส้มอิฐ)';
                subBtn.className = 'py-2 border border-rose-300 bg-rose-50 text-rose-700 rounded-xl font-semibold btn-hover-effect';
                addBtn.className = 'py-2 border border-oak-200 text-oak-600 rounded-xl font-semibold btn-hover-effect';
                costBox.classList.add('hidden');
                totalBox.classList.add('hidden');
            }
        }

        async function submitQuickAdjust() {
            const itemId = Number(document.getElementById('adjust-select-item').value);
            const qty = Number(document.getElementById('adjust-qty').value);
            const unitCost = Number(document.getElementById('adjust-unit-cost').value) || 0;
            const reason = document.getElementById('adjust-reason').value.trim() || (selectedAdjustType === 'ADD' ? 'เติมสต๊อกด่วน' : 'เบิกหน้าร้าน');

            if (!qty || qty <= 0) return alert('กรุณากรอกจำนวนที่ถูกต้อง');
            const item = items.find(i => Number(i.id) === itemId);
            if (!item) return;

            const targetDateStr = selectedDateStr || getFormattedDate();

            closeAdjustModal();
            showToast('บันทึกลง Sheet กำลังอัปเดต...');

            await syncItemToGoogleSheet('quickAdjust', { 
                date: targetDateStr, 
                code: item.code, 
                name: item.name, 
                type: selectedAdjustType, 
                qty: qty, 
                unitCost: unitCost, 
                reason: reason 
            });
        }

        /* ------------------ MANAGEMENT & RENDER ------------------ */
        function renderInventoryTable() {
            const container = document.getElementById('inventory-mobile-list');
            if (!container) return;

            const searchVal = normalizeText(document.getElementById('inventory-search')?.value || '');
            const catVal = document.getElementById('inventory-cat-filter')?.value || 'ALL';
            const statusVal = document.getElementById('inventory-status-filter')?.value || 'ALL';

            const filtered = items.filter(item => {
                const matchSearch = !searchVal || normalizeText(item.name).includes(searchVal) || normalizeText(item.code).includes(searchVal);
                const matchCat = (catVal === 'ALL') || (item.categoryId == catVal);
                let matchStatus = true;
                if (statusVal === 'LOW') matchStatus = Number(item.stock) <= Number(item.minAlert) && !item.isOrdered;
                else if (statusVal === 'ORDERED') matchStatus = Boolean(item.isOrdered);
                else if (statusVal === 'NORMAL') matchStatus = Number(item.stock) > Number(item.minAlert);

                return matchSearch && matchCat && matchStatus;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-xs text-oak-400 py-6 text-center font-light">ไม่พบรายการสินค้า</p>`;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const isLow = Number(item.stock) <= Number(item.minAlert);
                let statusBadge = item.isOrdered 
                    ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-100 text-amber-800">สั่งแล้ว (${item.orderedQty} ${escapeHtml(item.unit)})</span>` 
                    : (isLow ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-rose-100 text-rose-700">สต๊อกต่ำ</span>` : `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-sage-100 text-sage-700">ปกติ</span>`);

                return `
                    <div class="bg-[#FDFBF7] p-3.5 rounded-2xl border border-oak-200/60 card-shadow space-y-2 hover:border-oak-300 transition">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[10px] font-mono text-oak-400">${escapeHtml(item.code)}</span>
                                <h4 class="font-semibold text-oak-900 text-xs">${escapeHtml(item.name)}</h4>
                            </div>
                            ${statusBadge}
                        </div>
                        <div class="flex justify-between items-center bg-oak-50/60 p-2 rounded-xl text-xs">
                            <div>
                                <p class="text-[10px] text-oak-400">คงเหลือ</p>
                                <p class="font-bold ${isLow ? 'text-rose-600' : 'text-oak-800'}">${item.stock} ${escapeHtml(item.unit)}</p>
                            </div>
                            <div class="flex gap-1.5">
                                <button onclick="openQuickAdjustModalWithMode('ADD', ${item.id})" class="px-2.5 py-1.5 bg-sage-600 text-white font-bold rounded-xl text-xs shadow-sm hover:bg-sage-700 btn-hover-effect">+ เติม</button>
                                <button onclick="openQuickAdjustModalWithMode('SUB', ${item.id})" class="px-2.5 py-1.5 bg-rose-500 text-white font-bold rounded-xl text-xs shadow-sm hover:bg-rose-600 btn-hover-effect">- เบิก</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderDashboard() {
            const lowStockItems = items.filter(i => Number(i.stock) <= Number(i.minAlert));
            document.getElementById('stat-total-items').innerText = items.length;
            document.getElementById('stat-low-stock').innerText = lowStockItems.length;

            const now = new Date();
            const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

            const monthTotal = purchases.filter(p => {
                const k = p.dateKey || getDateKey(p.date);
                return k && k.startsWith(currentMonthKey);
            }).reduce((sum, p) => sum + Number(p.total || 0), 0);
            
            document.getElementById('stat-month-expense').innerText = `฿${monthTotal.toLocaleString('th-TH')}`;

            const totalStockValue = items.reduce((sum, item) => sum + (Number(item.stock) * Number(item.lastCost || 0)), 0);
            document.getElementById('stat-total-stock-value').innerText = `฿${totalStockValue.toLocaleString('th-TH')}`;
        }

        function renderAdjustLogs() {
            const container = document.getElementById('adjust-logs-mobile-container');
            if (!container) return;

            if (adjustLogs.length === 0) {
                container.innerHTML = `<p class="text-xs text-oak-400 py-4 text-center font-light">ยังไม่มีประวัติการปรับปรุงสต๊อก</p>`;
                return;
            }

            const sortedLogs = [...adjustLogs].sort((a, b) => parseDateTimeToTimestamp(b.timestamp || b.date) - parseDateTimeToTimestamp(a.timestamp || a.date));

            container.innerHTML = sortedLogs.map(log => {
                const isAdd = log.type === 'ADD';
                return `
                    <div class="p-2.5 bg-oak-50/60 rounded-xl border border-oak-200/50 flex justify-between items-center text-xs hover:bg-oak-100/50 transition">
                        <div>
                            <p class="font-semibold text-oak-900">${escapeHtml(log.itemName)}</p>
                            <p class="text-[10px] text-oak-400">${log.timestamp || log.date} | ${escapeHtml(log.reason || '-')}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold ${isAdd ? 'text-sage-600' : 'text-rose-600'}">
                                ${isAdd ? '+' : '-'}${log.qty} ${escapeHtml(log.unit || '')}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function populateCategoryDropdowns() {
            const catFilter = document.getElementById('inventory-cat-filter');
            if (catFilter) catFilter.innerHTML = '<option value="ALL">หมวดหมู่ทั้งหมด</option>' + categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
        }

        function renderAllViewsWithoutReset() {
            populateCategoryDropdowns();
            renderCalendarView();
            showDayDetails(selectedDateStr);
            if (activeTabId === 'inventory') renderInventoryTable();
            if (activeTabId === 'dashboard') renderDashboard();
            if (activeTabId === 'adjust-logs') renderAdjustLogs();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => { toast.classList.remove('opacity-100'); toast.classList.add('opacity-0'); }, 2500);
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        document.getElementById('inventory-search')?.addEventListener('input', renderInventoryTable);
        document.getElementById('inventory-cat-filter')?.addEventListener('change', renderInventoryTable);
        document.getElementById('inventory-status-filter')?.addEventListener('change', renderInventoryTable);

        window.addEventListener('DOMContentLoaded', () => {
            selectedDateStr = getFormattedDate();
            renderAllViewsWithoutReset();
            fetchDataFromGoogleSheet(false);
            startAutoSync();
        });
    </script>
</body>
</html>
